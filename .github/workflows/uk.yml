name: UK intelligence checks and discovery
on:
  pull_request:
    paths: ['uk.html','uk/**','shared/**','engine/uk/**','.github/workflows/uk.yml','index.html','india.html','vercel.json']
  push:
    branches: [uk-intelligence-foundation, uk-portal-v2, uk-daily-desk, uk-research-careers-v3, uk-archive-seo-v4, uk-ui-polish-v5, main]
    paths: ['uk.html','uk/**','shared/**','engine/uk/**','.github/workflows/uk.yml']
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uk-intelligence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check uk/app.js && node --check uk/research.js && node --test engine/uk/test.mjs && node engine/uk/render.mjs --check
      - run: npm install --no-save --package-lock=false playwright-core@1.51.1 axe-core@4.10.3
      - run: node engine/uk/browser-test.mjs
      - run: node engine/uk/quality-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-ui-review
          path: ui-review/
          retention-days: 7
  discover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node engine/uk/discover.mjs
      - run: node engine/uk/source-dossiers.mjs
      - if: always()
        run: node engine/uk/policy-feed.mjs
      - if: always()
        run: node engine/uk/case-archive.mjs
      - if: always()
        run: node engine/uk/research-queue.mjs
      - if: always()
        run: |
          git config user.name "corporate-law-tracker-bot"
          git config user.email "actions@github.com"
          git add uk/discovery.json uk/source-dossiers.json uk/policy-feed.json uk/case-archive.json uk/research-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: UK research discovery snapshot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright-core@1.51.1
      - run: node engine/uk/live-check.mjs
