name: Update Corporate Law Tracker

# Runs nightly at 11:00 PM IST (17:30 UTC) and on manual trigger.
on:
  schedule:
    - cron: "30 17 * * *"   # nightly 11:00 PM IST — ingest + enrich new deals
    - cron: "0 1 1 * *"     # monthly (1st) — refresh AI enrichment across all live deals
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      backfill_days:
        description: "One-off backfill: days of exchange history to pull (blank = normal 3-day run). Try 120 once to load existing public deals."
        required: false
        default: ""
      reenrich:
        description: "Enrich/refresh existing deals with AI. Enter a batch size (e.g. 120); marquee→deep+web-search, rest→AI no-search. Re-run until '0 due'. Needs the ANTHROPIC_API_KEY secret."
        required: false
        default: ""

# allow the built-in token to commit the refreshed index.html
permissions:
  contents: write

concurrency:
  group: clt-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install engine dependencies
        working-directory: engine
        run: npm install --no-audit --no-fund

      - name: Run the pipeline
        working-directory: engine
        env:
          # OPTIONAL: add this secret only if you want AI deep-enrichment.
          # Leave it unset to run completely FREE (rule-based, still ingests the full spine).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLT_PRESS_MAX: "12"     # Bar & Bench / RSS items (named law-firm teams) per run
          CLT_SPINE_MAX: "120"    # safety ceiling on disclosures ingested per run
          CLT_SPINE_MIN: "25"     # materiality THRESHOLD — keep every deal above this, drop noise (LOWER = more deals)
          CLT_AI_MAX: "50"        # max AI enrichments per nightly run (cost cap; marquee→web-search, rest→no search)
          # Backfill: blank on schedule; set via the "Run workflow" button to load history once.
          CLT_BACKFILL: ${{ github.event.inputs.backfill_days }}
        run: npm run build

      - name: Enrich / refresh existing deals (AI, tiered)
        if: ${{ github.event.inputs.reenrich != '' || github.event.schedule == '0 1 1 * *' }}
        working-directory: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLT_REENRICH: ${{ github.event.inputs.reenrich || '150' }}
          CLT_REENRICH_AGE: "30"
        run: node reenrich.mjs

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain data.js engine/seen.json engine/discovered-sources.json engine/link-report.json brief.md)" ]]; then
            git config user.name  "corporate-law-tracker-bot"
            git config user.email "actions@github.com"
            git add data.js engine/seen.json engine/discovered-sources.json engine/link-report.json brief.md
            git commit -m "chore: nightly deal update ($(date -u +%Y-%m-%d))"
            git push
            echo "Committed updated data.js — Vercel will redeploy."
          else
            echo "No changes to commit."
          fi
