<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Law Tracker — Deal & Regulatory Intelligence</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#fbfcfd;
    --ink:#0e1320; --ink2:#4a5364; --ink3:#8b93a3; --ink4:#aab1bf;
    --line:#e6e9ef; --line2:#f0f2f6;
    --accent:#2f54eb; --accent-soft:#eaeefe;
    --green:#0c8f5a; --green-soft:#e4f5ec;
    --amber:#b87400; --amber-soft:#faf0db;
    --red:#cf3a52;   --red-soft:#fce9ec;
    --purple:#6e44d4;--purple-soft:#efe9fb;
    --teal:#0a8585;  --teal-soft:#e0f3f3;
    --slate:#475569; --slate-soft:#eef1f5;
    --shadow:0 1px 2px rgba(14,19,32,.05),0 3px 10px rgba(14,19,32,.045);
    --shadow-h:0 6px 16px rgba(14,19,32,.09),0 18px 40px rgba(14,19,32,.10);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --r:13px; --r-sm:8px;
  }
  html[data-theme="dark"]{
    --bg:#0a0e17; --surface:#121826; --surface2:#0f1421;
    --ink:#eaf0fb; --ink2:#a3afc4; --ink3:#6b7589; --ink4:#525c70;
    --line:#202838; --line2:#1a2230;
    --accent:#5a7bff; --accent-soft:#18203a;
    --green:#37c98b; --green-soft:#0f2a20;
    --amber:#e0a23a; --amber-soft:#2a2212;
    --red:#f0697f;   --red-soft:#2c1620;
    --purple:#a585f5;--purple-soft:#1f1832;
    --teal:#3ab9b9;  --teal-soft:#0e2626;
    --slate:#9aa6bd; --slate-soft:#1a2230;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 8px 30px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
  a{color:var(--accent);text-decoration:none}

  header{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:16px;padding:0 22px}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7d97ff);color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(47,84,235,.32)}
  .brand .nm{font-weight:750;font-size:15.5px;letter-spacing:-.3px;line-height:1}
  .brand .nm span{display:block;font-size:9px;font-weight:600;color:var(--ink3);letter-spacing:1.4px;margin-top:3px}
  .search{flex:1;max-width:420px;position:relative}
  .search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 14px 9px 38px;font-size:13.5px;color:var(--ink);outline:none;transition:.15s;font-family:inherit}
  .search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
  .search svg{position:absolute;left:12px;top:10px}
  .advbtn{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:none;border-radius:6px;padding:4px 8px;position:absolute;right:8px;top:7px;cursor:pointer}
  .hstatus{margin-left:auto;display:flex;align-items:center;gap:13px}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--green);letter-spacing:.3px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(12,143,90,.5);animation:p 2.2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 6px rgba(12,143,90,0)}100%{box-shadow:0 0 0 0 rgba(12,143,90,0)}}
  .upd{font-size:12px;color:var(--ink3)}
  .icbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.15s}
  .icbtn:hover{border-color:var(--accent);color:var(--accent)}

  .wrap{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;height:calc(100vh - 60px)}
  aside{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px 12px}
  .main{overflow-y:auto;padding:20px 26px 50px}
  .rail{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 16px}

  .ng{margin-bottom:20px}
  .ng h4{font-size:10px;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase;font-weight:750;margin:0 8px 8px}
  .ni{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:550;transition:.12s}
  .ni:hover{background:var(--bg);color:var(--ink)}
  .ni.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .ni .dot{width:8px;height:8px;border-radius:3px;flex:none}
  .ni .ic{width:16px;text-align:center;flex:none}
  .ni .ct{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--ink3)}
  .ni.active .ct{color:var(--accent)}

  /* stats with hover popover */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;cursor:pointer;transition:.14s}
  .stat:hover{border-color:var(--accent);box-shadow:var(--shadow-h)}
  .stat .n{font-size:25px;font-weight:760;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;color:var(--ink2);margin-top:1px}
  .stat .d{font-size:10.5px;margin-top:6px;font-weight:650;color:var(--green)}
  .stat .d.muted{color:var(--ink3)}
  .pop{position:absolute;top:calc(100% + 8px);left:0;width:330px;max-width:90vw;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-h);padding:8px;z-index:30;display:none;max-height:340px;overflow-y:auto}
  .stat:hover .pop{display:block}
  .pop .ph{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:700;padding:6px 8px 8px}
  .pop .pr{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer}
  .pop .pr:hover{background:var(--bg)}
  .pop .pr .pt{font-size:9px;font-weight:750;padding:2px 6px;border-radius:5px;flex:none;margin-top:1px}
  .pop .pr .px{font-size:12px;font-weight:600;line-height:1.35}

  .fb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--surface);border:1px solid var(--line);color:var(--ink2);padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  html[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .vh{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .vh h2{font-size:20px;font-weight:760;letter-spacing:-.5px}
  .vh .sub{color:var(--ink3);font-size:12.5px;font-weight:600}
  .clearf{font-size:11.5px;color:var(--accent);font-weight:700;cursor:pointer;margin-left:auto}

  .feed{display:flex;flex-direction:column;gap:11px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;position:relative}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--accent)}
  .accentbar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
  .r1{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .ttype{font-size:10px;font-weight:750;letter-spacing:.4px;padding:3px 8px;border-radius:6px;flex:none;text-transform:uppercase}
  .t-ma{background:var(--accent-soft);color:var(--accent)} .t-ipo{background:var(--green-soft);color:var(--green)}
  .t-pe{background:var(--purple-soft);color:var(--purple)} .t-ibc{background:var(--red-soft);color:var(--red)}
  .t-reg{background:var(--amber-soft);color:var(--amber)} .t-bank{background:var(--teal-soft);color:var(--teal)}
  .t-lit{background:var(--slate-soft);color:var(--slate)}
  .stage{font-size:10.5px;font-weight:650;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
  .stage .sd{width:6px;height:6px;border-radius:50%}
  .priority{font-size:10px;font-weight:750;color:var(--red);letter-spacing:.3px}
  .ver{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:6px;cursor:pointer}
  .ver.thin{color:var(--ink3);background:var(--bg)}
  .real{font-size:9px;font-weight:750;color:#fff;background:var(--green);padding:2px 6px;border-radius:5px;letter-spacing:.4px}
  .illus{font-size:9px;font-weight:750;color:var(--ink3);background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:5px;letter-spacing:.3px}
  .star{margin-left:auto;cursor:pointer;color:var(--ink4);font-size:18px;line-height:1;background:none;border:none;padding:0;transition:.12s;z-index:2}
  .star:hover{transform:scale(1.2);color:var(--amber)} .star.on{color:var(--amber)}
  .card h3{font-size:16px;font-weight:680;line-height:1.34;letter-spacing:-.2px;margin-bottom:7px}
  .card:hover h3{color:var(--accent)}
  .sum{color:var(--ink2);font-size:13.5px;line-height:1.55;margin-bottom:12px}
  .sum b{color:var(--ink);font-weight:680}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{background:var(--bg);border:1px solid var(--line);color:var(--ink2);padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600}
  .tag.val{color:var(--green);font-family:var(--mono);font-weight:700;background:var(--green-soft);border-color:transparent}
  .tag.geo{color:var(--accent);background:var(--accent-soft);border-color:transparent}
  .firms{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
  .firms b{color:var(--ink);font-weight:700}
  .firms .fm{font-weight:650;color:var(--ink)} .firms .side{color:var(--ink3);font-size:11.5px}
  .srcrow{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
  .schip{font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .stime{font-size:11.5px;color:var(--ink3);margin-left:auto} .go{font-size:12px;color:var(--accent);font-weight:700}
  .card:hover .go{text-decoration:underline}

  /* deal detail */
  .back{font-size:12.5px;font-weight:650;color:var(--ink2);cursor:pointer;display:inline-flex;gap:5px;align-items:center;margin-bottom:14px}
  .back:hover{color:var(--accent)}
  .dd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .dd h1{font-size:25px;font-weight:780;letter-spacing:-.6px;line-height:1.22;margin-bottom:10px;max-width:760px}
  .dd .lede{font-size:15px;color:var(--ink2);line-height:1.6;max-width:760px;margin-bottom:16px}
  .dd .lede b{color:var(--ink)}
  .dd-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
  @media(max-width:900px){.dd-grid{grid-template-columns:1fr}}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .sec h4{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink3);font-weight:750;margin-bottom:12px}
  .sec p{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-bottom:10px}
  .sec p:last-child{margin-bottom:0} .sec p b{color:var(--ink)}
  .firmblk{padding:12px 0;border-bottom:1px solid var(--line2)} .firmblk:last-child{border:none;padding-bottom:0}
  .firmblk:first-child{padding-top:0}
  .firmblk .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .firmblk .fn{font-size:14.5px;font-weight:720;color:var(--ink);cursor:pointer}
  .firmblk .fn:hover{color:var(--accent)}
  .sidetag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .lead{font-size:13px;color:var(--ink);margin:3px 0}
  .lead .role{color:var(--ink3);font-size:11.5px;font-weight:500}
  .teamline{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.6}
  .teamline .lbl{color:var(--ink3);font-weight:650} .note{font-size:12px;color:var(--ink3);font-style:italic}
  /* source list with blurbs */
  .srcitem{padding:11px 0;border-bottom:1px solid var(--line2)} .srcitem:last-child{border:none;padding-bottom:0} .srcitem:first-child{padding-top:0}
  .srcitem .st{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .srcitem .snm{font-size:13px;font-weight:720;color:var(--ink)}
  .srcitem .sgo{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent)} .srcitem .sgo:hover{text-decoration:underline}
  .srcitem .sblurb{font-size:12.5px;color:var(--ink2);line-height:1.55;background:var(--surface2);border-left:2px solid var(--accent);padding:7px 11px;border-radius:0 7px 7px 0;font-style:italic}
  .doc{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:.12s}
  .doc:hover{border-color:var(--accent);color:var(--accent);background:var(--surface2)}
  .doc .di{font-size:15px} .doc:last-child{margin-bottom:0}
  .side-meta{font-size:13px}
  .side-meta .mrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2)}
  .side-meta .mrow:last-child{border:none}
  .side-meta .mk{color:var(--ink3);font-weight:600} .side-meta .mv{color:var(--ink);font-weight:700;text-align:right}
  .tl{position:relative;padding-left:18px} .tl .ev{position:relative;padding-bottom:13px}
  .tl .ev:before{content:"";position:absolute;left:-13px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .tl .ev:after{content:"";position:absolute;left:-9.5px;top:12px;bottom:-2px;width:1px;background:var(--line)}
  .tl .ev:last-child:after{display:none}
  .tl .ed{font-size:11px;color:var(--ink3);font-weight:700} .tl .et{font-size:12.5px;color:var(--ink);margin-top:2px}

  /* firms directory + firm page */
  .firmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.14s}
  .fcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:var(--accent)}
  .fcard .fnm{font-size:15px;font-weight:740;letter-spacing:-.2px} .fcard:hover .fnm{color:var(--accent)}
  .fcard .fmeta{font-size:12px;color:var(--ink3);margin-top:3px}
  .fcard .ffocus{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.5}
  .fcard .fstat{margin-top:11px;display:flex;gap:14px;font-size:12px}
  .fcard .fstat b{font-size:18px;font-weight:760;display:block;color:var(--ink)}
  .fcard .fstat span{color:var(--ink3)}
  .firmhero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
  .firmhero h1{font-size:24px;font-weight:780;letter-spacing:-.5px}
  .firmhero .fmeta{font-size:13px;color:var(--ink3);margin-top:5px}
  .firmhero .ffocus{font-size:13.5px;color:var(--ink2);margin-top:11px;line-height:1.6;max-width:680px}
  .firmhero .fweb{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700}
  .pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .pchip{font-size:12px;font-weight:650;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:5px 12px;color:var(--ink)}
  .pchip .pr{color:var(--ink3);font-weight:500;font-size:11px}

  .rail h4{font-size:10px;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase;font-weight:750;margin:0 0 12px}
  .blk{margin-bottom:24px}
  .lr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
  .lr:last-child{border:none} .lr:hover .fn{color:var(--accent)}
  .lr .rk{font-family:var(--mono);color:#fff;background:var(--ink3);width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
  .lr:nth-child(1) .rk{background:var(--accent)} .lr:nth-child(2) .rk{background:#6d8bff} .lr:nth-child(3) .rk{background:#9db4ff}
  .lr .fn{flex:1;font-weight:600} .lr .dl{font-family:var(--mono);color:var(--ink2);font-weight:700}
  .reg{padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer} .reg:last-child{border:none}
  .reg .when{font-size:9.5px;color:var(--amber);font-weight:750;text-transform:uppercase;letter-spacing:.6px}
  .reg .what{color:var(--ink);font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.4} .reg:hover .what{color:var(--accent)}
  .cov{font-size:12.5px;color:var(--ink2);line-height:1.85}
  .empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:13.5px}
  .demo{background:linear-gradient(90deg,var(--accent-soft),transparent);border:1px solid var(--line);color:var(--ink2);font-size:12px;padding:9px 14px;border-radius:11px;margin-bottom:16px;display:flex;gap:9px;align-items:center}
  .demo b{color:var(--ink)}
  .foot{font-size:11px;color:var(--ink3);text-align:center;padding:22px}

  /* advanced search modal */
  .ovl{position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:80px}
  .ovl.on{display:flex} html[data-theme="dark"] .ovl{background:rgba(0,0,0,.65)}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-h);width:640px;max-width:94vw;padding:22px 24px}
  .modal h3{font-size:17px;font-weight:760;margin-bottom:4px} .modal .msub{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .fld label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:5px}
  .fld select,.fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink);font-family:inherit;outline:none}
  .fld select:focus,.fld input:focus{border-color:var(--accent)}
  .mact{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
  .mbtn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
  .mbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mbtn:hover{transform:translateY(-1px)}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--surface)}
  @media(max-width:1140px){.wrap{grid-template-columns:210px minmax(0,1fr)}.rail{display:none}}
  @media(max-width:780px){.wrap{grid-template-columns:1fr;height:auto}aside{display:none}.stats{grid-template-columns:repeat(2,1fr)}.search{display:none}.dd-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>

 {id:"dpdp-rules", real:false, type:"reg", geo:"global", sector:"Technology", imp:"md", stage:"inforce",
  value:"—", parties:"MeitY", time:"4 Jun 2026", ver:7,
  headline:"DPDP Rules notified — phased compliance timelines confirmed",
  sum:"DPDP Rules operationalise consent-manager registration and breach-notification windows. <b>Data-processing agreements & cross-border transfer clauses</b> need a refresh across portfolios.",
  detail:"Illustrative regulatory entry of broad relevance. Production deep-links to the notification on the MeitY/PIB site.",
  firms:[], sources:[{name:"PIB / MeitY", url:"https://www.meity.gov.in", blurb:"The notified DPDP Rules are the primary text for compliance timelines. (Illustrative — production links to the specific notification.)"}],
  docs:[{label:"MeitY notifications", url:"https://www.meity.gov.in"}], timeline:[{d:"4 Jun 2026",t:"Rules notified; phased timelines confirmed"}]}
];

/* ============================ STATE ============================ */
let route={name:"feed"};
let F={geo:"all",type:null,sector:"All Sectors",q:"",firm:"",firm2:"",city:"",stage:""};
let starred=new Set();

/* ============================ HELPERS ============================ */
const $=id=>document.getElementById(id);
function dealFirms(d){return d.firms.map(f=>f.name);}
function go(r){route=r;window.scrollTo(0,0);render();}
function resetFilters(){F={geo:"all",type:null,sector:"All Sectors",q:"",firm:"",firm2:"",city:"",stage:""};$("q").value="";}
function matchesFilters(d){
  if(F.geo!=="all"&&d.geo!==F.geo)return false;
  if(F.type&&d.type!==F.type)return false;
  if(F.sector!=="All Sectors"&&d.sector!==F.sector)return false;
  if(F.city&&d.geo!==F.city)return false;
  if(F.stage&&d.stage!==F.stage)return false;
  if(F.firm&&!dealFirms(d).includes(F.firm))return false;
  if(F.firm2&&!dealFirms(d).includes(F.firm2))return false;
  if(F.q){
    const hay=(d.headline+d.sum+d.detail+d.parties+d.sector+d.firms.map(f=>f.name+" "+(f.lead||[]).map(l=>l.n).join(" ")+" "+(f.team||[]).join(" ")).join(" ")).toLowerCase();
    if(!hay.includes(F.q.toLowerCase()))return false;
  }
  return true;
}
function anyFilterActive(){return F.geo!=="all"||F.type||F.sector!=="All Sectors"||F.q||F.firm||F.firm2||F.city||F.stage;}

/* ============================ SIDEBAR ============================ */
function buildSidebar(){
  const browse=[{k:"feed",ic:"▤",label:"Deals Feed"},{k:"firms",ic:"⚖",label:"Firms Directory"},{k:"watch",ic:"★",label:"Watchlist"}];
  $("browseNav").innerHTML=browse.map(b=>`<div class="ni" data-browse="${b.k}"><span class="ic">${b.ic}</span>${b.label}${b.k==="watch"?`<span class="ct" id="starCt">${starred.size}</span>`:""}</div>`).join("");
  $("geoNav").innerHTML=GEOS.map(g=>{const ct=g.id==="all"?DEALS.length:DEALS.filter(d=>d.geo===g.id).length;
    return `<div class="ni" data-geo="${g.id}"><span class="dot" style="background:${g.dot}"></span>${g.label}<span class="ct">${ct}</span></div>`}).join("");
  $("typeNav").innerHTML=Object.entries(TYPES).map(([k,v])=>{const ct=DEALS.filter(d=>d.type===k).length;
    return `<div class="ni" data-type="${k}"><span class="dot" style="background:${v.c}"></span>${v.label}<span class="ct">${ct}</span></div>`}).join("");
  $("browseNav").querySelectorAll("[data-browse]").forEach(n=>n.onclick=()=>{const k=n.dataset.browse;
    if(k==="feed"){resetFilters();go({name:"feed"});}else if(k==="firms")go({name:"firms"});else go({name:"watch"});});
  $("geoNav").querySelectorAll("[data-geo]").forEach(n=>n.onclick=()=>{F.geo=n.dataset.geo;F.firm="";F.firm2="";go({name:"feed"});});
  $("typeNav").querySelectorAll("[data-type]").forEach(n=>n.onclick=()=>{F.type=n.dataset.type;go({name:"feed"});});
}
function markSidebar(){
  document.querySelectorAll("aside .ni").forEach(n=>n.classList.remove("active"));
  if(route.name==="feed"){$("geoNav").querySelector(`[data-geo="${F.geo}"]`)?.classList.add("active");
    if(F.type)$("typeNav").querySelector(`[data-type="${F.type}"]`)?.classList.add("active");
    if(!F.type&&F.geo==="all"&&!anyFilterActive())$("browseNav").querySelector('[data-browse="feed"]')?.classList.add("active");}
  else if(route.name==="firms")$("browseNav").querySelector('[data-browse="firms"]')?.classList.add("active");
  else if(route.name==="watch")$("browseNav").querySelector('[data-browse="watch"]')?.classList.add("active");
}

/* ============================ RENDERERS ============================ */
function typeBadge(d){const t=TYPES[d.type];return `<span class="ttype ${t.cls}">${t.label}</span>`;}
function verBadge(d){return d.ver>=5?`<span class="ver" title="Corroborated across ${d.ver} independent sources">✓ ${d.ver} sources</span>`:`<span class="ver thin">${d.ver} source${d.ver>1?'s':''}</span>`;}

function dealCard(d){
  const t=TYPES[d.type], st=STAGES[d.stage], g=CITYLABEL[d.geo];
  const firms=d.firms.length?`<div class="firms"><b>Counsel:</b> ${d.firms.map(f=>`<span class="fm">${f.name}</span> <span class="side">(${f.side})</span>`).join(" · ")}</div>`:"";
  return `<div class="card" data-deal="${d.id}">
    <div class="accentbar" style="background:${t.c}"></div>
    <div class="r1">${typeBadge(d)}
      <span class="stage"><span class="sd" style="background:${st.c}"></span>${st.l}</span>
      ${d.imp==="hi"?'<span class="priority">● PRIORITY</span>':""}
      ${d.real?'<span class="real">✓ VERIFIED</span>':'<span class="illus">SAMPLE</span>'}
      ${verBadge(d)}
      <button class="star ${starred.has(d.id)?'on':''}" data-star="${d.id}">${starred.has(d.id)?'★':'☆'}</button>
    </div>
    <h3>${d.headline}</h3>
    <div class="sum">${d.sum}</div>
    <div class="meta"><span class="tag geo">${g}</span><span class="tag">${d.sector}</span>
      ${d.value&&d.value!=="—"?`<span class="tag val">${d.value}</span>`:""}<span class="tag">${d.parties}</span></div>
    ${firms}
    <div class="srcrow">${d.sources.map(s=>`<span class="schip">${s.name}</span>`).join("")}
      <span class="stime">${d.time}</span><span class="go">View deal →</span></div>
  </div>`;
}

function renderFeed(title,list,sub){
  const clear=anyFilterActive()&&route.name==="feed"?`<span class="clearf" id="clearF">✕ Clear filters</span>`:"";
  let chips=route.name==="feed"?`<div class="fb" id="sectorBar">${SECTORS.map(s=>`<span class="chip ${s===F.sector?'on':''}" data-sec="${s}">${s}</span>`).join("")}</div>`:"";
  const body=list.length?`<div class="feed">${list.map(dealCard).join("")}</div>`:`<div class="empty">No matching developments. Clear the search or pick another filter.</div>`;
  $("main").innerHTML=`
    <div class="demo">⚙️ <span><b>Prototype.</b> <span class="real" style="vertical-align:middle">✓ VERIFIED</span> cards are real, deep-linked items from Bar &amp; Bench (8 Jun 2026). <b>SAMPLE</b> cards show the structure; live data fills them in production.</span></div>
    ${route.name==="feed"?`<div class="stats" id="stats"></div>`:""}
    ${chips}
    <div class="vh"><h2>${title}</h2><span class="sub">${sub||(list.length+(list.length===1?" item":" items"))}</span>${clear}</div>
    ${body}
    <div class="foot">Corporate Law Tracker prototype · Headlines &amp; snippets under fair-use linking · Open the primary source &amp; filings before advising.</div>`;
  if(route.name==="feed")buildStats();
  bindCards();
  if(route.name==="feed"){
    $("sectorBar")?.querySelectorAll("[data-sec]").forEach(c=>c.onclick=()=>{F.sector=c.dataset.sec;render();});
    $("clearF")&&($("clearF").onclick=()=>{resetFilters();render();});
  }
}

function renderFirms(){
  const names=Object.keys(FIRMS).filter(n=>DEALS.some(d=>dealFirms(d).includes(n)))
    .sort((a,b)=>cnt(b)-cnt(a));
  function cnt(n){return DEALS.filter(d=>dealFirms(d).includes(n)).length;}
  const cards=names.map(n=>{const f=FIRMS[n];const c=cnt(n);
    const partners=collectPartners(n).length;
    return `<div class="fcard" data-firm="${encodeURIComponent(n)}">
      <div class="fnm">${n}</div>
      <div class="fmeta">${f.city} · ${f.type}</div>
      <div class="ffocus">${f.focus}</div>
      <div class="fstat"><div><b>${c}</b><span>deals tracked</span></div><div><b>${partners}</b><span>partners seen</span></div></div>
    </div>`}).join("");
  $("main").innerHTML=`
    <div class="demo">⚖️ <span><b>Firms Directory.</b> Click a firm to see only its deals, the partners and teams involved, and links out to each matter.</span></div>
    <div class="vh"><h2>Firms Directory</h2><span class="sub">${names.length} firms tracked</span></div>
    <div class="firmgrid">${cards}</div>
    <div class="foot">Firm profiles are factual descriptions; deal-level teams are sourced per matter.</div>`;
  $("main").querySelectorAll("[data-firm]").forEach(c=>c.onclick=()=>go({name:"firm",id:decodeURIComponent(c.dataset.firm)}));
}

function collectPartners(name){
  const set=new Map();
  DEALS.forEach(d=>d.firms.filter(f=>f.name===name).forEach(f=>(f.lead||[]).forEach(l=>set.set(l.n,l.role))));
  return [...set.entries()].map(([n,role])=>({n,role}));
}
function renderFirm(name){
  const f=FIRMS[name]; if(!f){go({name:"firms"});return;}
  const list=DEALS.filter(d=>dealFirms(d).includes(name));
  const partners=collectPartners(name);
  const pchips=partners.length?`<div class="pchips">${partners.map(p=>`<span class="pchip">${p.n}${p.role?` <span class="pr">· ${p.role}</span>`:""}</span>`).join("")}</div>`:`<div class="note" style="margin-top:10px">Named partners populate from deal announcements as the live feed runs.</div>`;
  $("main").innerHTML=`
    <span class="back" onclick="go({name:'firms'})">← Firms Directory</span>
    <div class="firmhero">
      <h1>${name}</h1>
      <div class="fmeta">${f.city} · ${f.type} firm</div>
      <div class="ffocus">${f.focus}</div>
      <a class="fweb" href="${f.web}" target="_blank" rel="noopener">Visit firm website ↗</a>
      <div style="margin-top:16px"><h4 style="font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink3);font-weight:750;margin-bottom:4px">Partners seen on tracked deals</h4>${pchips}</div>
    </div>
    <div class="vh"><h2>Deals · ${name}</h2><span class="sub">${list.length} tracked</span></div>
    <div class="feed">${list.map(dealCard).join("")}</div>`;
  bindCards();
}

function renderDeal(id){
  const d=DEALS.find(x=>x.id===id); if(!d){go({name:"feed"});return;}
  const t=TYPES[d.type], st=STAGES[d.stage];
  const firmsHtml=d.firms.length?d.firms.map(f=>{
    const lead=(f.lead&&f.lead.length)?f.lead.map(l=>`<div class="lead"><b>${l.n}</b> <span class="role">— ${l.role}</span></div>`).join(""):"";
    const team=(f.team&&f.team.length)?`<div class="teamline"><span class="lbl">Team:</span> ${f.team.join(" · ")}</div>`:"";
    const note=f.note?`<div class="note" style="margin-top:5px">${f.note}</div>`:"";
    return `<div class="firmblk"><div class="fh"><span class="fn" onclick="go({name:'firm',id:'${f.name.replace(/'/g,"\\'")}'})">${f.name}</span><span class="sidetag">${f.side}</span></div>${lead}${team}${note}</div>`;
  }).join(""):`<div class="note">No counsel recorded for this item.</div>`;

  const srcHtml=d.sources.map(s=>`<div class="srcitem"><div class="st"><span class="snm">${s.name}</span><a class="sgo" href="${s.url}" target="_blank" rel="noopener">Open article ↗</a></div><div class="sblurb">${s.blurb}</div></div>`).join("");
  const docsHtml=d.docs&&d.docs.length?d.docs.map(dc=>`<div class="doc" onclick="window.open('${dc.url}','_blank','noopener')"><span class="di">📄</span>${dc.label}<span style="margin-left:auto;color:var(--ink3)">↗</span></div>`).join(""):`<div class="note">No public documents linked yet.</div>`;
  const tl=d.timeline&&d.timeline.length?`<div class="sec"><h4>Timeline</h4><div class="tl">${d.timeline.map(e=>`<div class="ev"><div class="ed">${e.d}</div><div class="et">${e.t}</div></div>`).join("")}</div></div>`:"";
  const related=DEALS.filter(x=>x.id!==d.id&&(x.sector===d.sector||x.firms.some(f=>dealFirms(d).includes(f.name)))).slice(0,3);
  const relHtml=related.length?`<div class="sec"><h4>Related deals</h4>${related.map(r=>`<div class="doc" onclick="go({name:'deal',id:'${r.id}'})"><span class="di">${TYPES[r.type].label==="M&A"?"🤝":"●"}</span>${r.headline}<span style="margin-left:auto;color:var(--ink3)">→</span></div>`).join("")}</div>`:"";

  $("main").innerHTML=`
   <span class="back" onclick="go({name:'feed'})">← Back to feed</span>
   <div class="dd">
     <div class="dd-head">${typeBadge(d)}
       <span class="stage"><span class="sd" style="background:${st.c}"></span>${st.l}</span>
       ${d.imp==="hi"?'<span class="priority">● PRIORITY</span>':""}
       ${d.real?'<span class="real">✓ VERIFIED · REAL SOURCE</span>':'<span class="illus">SAMPLE STRUCTURE</span>'}
       ${verBadge(d)}
       <button class="star ${starred.has(d.id)?'on':''}" data-star="${d.id}" style="margin-left:6px">${starred.has(d.id)?'★':'☆'}</button>
     </div>
     <h1>${d.headline}</h1>
     <div class="lede">${d.sum}</div>
     <div class="dd-grid">
       <div>
         <div class="sec"><h4>What happened</h4><p>${d.detail}</p></div>
         <div class="sec"><h4>Counsel & teams</h4>${firmsHtml}</div>
         <div class="sec"><h4>Sources · what each adds <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink4)">(${d.sources.length})</span></h4>${srcHtml}</div>
         <div class="sec"><h4>Public documents</h4>${docsHtml}</div>
       </div>
       <div>
         <div class="sec"><h4>Deal facts</h4><div class="side-meta">
           <div class="mrow"><span class="mk">Type</span><span class="mv">${t.label}</span></div>
           <div class="mrow"><span class="mk">Stage</span><span class="mv">${st.l}</span></div>
           <div class="mrow"><span class="mk">Value</span><span class="mv">${d.value}</span></div>
           <div class="mrow"><span class="mk">Parties</span><span class="mv">${d.parties}</span></div>
           <div class="mrow"><span class="mk">Sector</span><span class="mv">${d.sector}</span></div>
           <div class="mrow"><span class="mk">City</span><span class="mv">${CITYLABEL[d.geo]}</span></div>
           <div class="mrow"><span class="mk">Sources</span><span class="mv">${d.ver} corroborating</span></div>
           <div class="mrow"><span class="mk">Updated</span><span class="mv">${d.time}</span></div>
         </div></div>
         ${tl}
         ${relHtml}
       </div>
     </div>
   </div>`;
  $("main").querySelectorAll("[data-star]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleStar(b.dataset.star);render();});
}

/* ============================ STATS (clickable + hover) ============================ */
function buildStats(){
  const groups=[
   {n:DEALS.length,l:"Developments tracked",d:"▲ live feed",list:DEALS},
   {n:DEALS.filter(d=>["ma","ipo","pe"].includes(d.type)).length,l:"Active deals · M&A/PE/IPO",d:"▲ 3 new today",list:DEALS.filter(d=>["ma","ipo","pe"].includes(d.type))},
   {n:DEALS.filter(d=>d.type==="ipo").length,l:"IPO / ECM in motion",d:"DRHP & QIP pipeline",muted:true,list:DEALS.filter(d=>d.type==="ipo")},
   {n:DEALS.filter(d=>d.type==="reg").length,l:"Regulatory actions",d:"▲ comment windows open",list:DEALS.filter(d=>d.type==="reg")}
  ];
  $("stats").innerHTML=groups.map((g,i)=>`<div class="stat" data-stat="${i}">
    <div class="n">${g.n}</div><div class="l">${g.l}</div><div class="d ${g.muted?'muted':''}">${g.d}</div>
    <div class="pop"><div class="ph">${g.l} — click to open</div>${g.list.map(d=>`<div class="pr" data-deal="${d.id}"><span class="pt ${TYPES[d.type].cls}">${TYPES[d.type].label}</span><span class="px">${d.headline}</span></div>`).join("")}</div>
  </div>`).join("");
  $("stats").querySelectorAll(".pop .pr").forEach(r=>r.onclick=e=>{e.stopPropagation();go({name:"deal",id:r.dataset.deal});});
}

/* ============================ RAIL ============================ */
function buildRail(){
  const tally={};DEALS.forEach(d=>d.firms.forEach(f=>tally[f.name]=(tally[f.name]||0)+1));
  const ranked=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("league").innerHTML=ranked.map((r,i)=>`<div class="lr" data-firm="${encodeURIComponent(r[0])}"><span class="rk">${i+1}</span><span class="fn">${r[0]}</span><span class="dl">${r[1]}</span></div>`).join("");
  $("league").querySelectorAll("[data-firm]").forEach(n=>n.onclick=()=>go({name:"firm",id:decodeURIComponent(n.dataset.firm)}));
  const radar=DEALS.filter(d=>d.type==="reg"||d.type==="bank");
  $("radar").innerHTML=radar.map(d=>`<div class="reg" data-deal="${d.id}"><div class="when">${d.sources[0].name.split('—')[0].trim()} · ${d.time}</div><div class="what">${d.headline}</div></div>`).join("");
  $("radar").querySelectorAll("[data-deal]").forEach(n=>n.onclick=()=>go({name:"deal",id:n.dataset.deal}));
  $("cov").innerHTML="Bar &amp; Bench · LiveLaw · Mint · Economic Times · Business Standard · VCCircle · BSE / NSE · SEBI · CCI · IBBI · RBI · PIB · FT (internal)";
}

/* ============================ INTERACTIONS ============================ */
function bindCards(){
  $("main").querySelectorAll("[data-deal]").forEach(c=>{
    if(c.classList.contains("pr"))return;
    c.onclick=e=>{if(e.target.closest("[data-star]"))return;go({name:"deal",id:c.dataset.deal});};
  });
  $("main").querySelectorAll("[data-star]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleStar(b.dataset.star);render();});
}
function toggleStar(id){starred.has(id)?starred.delete(id):starred.add(id);const el=$("starCt");if(el)el.textContent=starred.size;}

/* ============================ ADVANCED SEARCH ============================ */
function buildAdv(){
  const firmOpts=`<option value="">Any firm</option>`+Object.keys(FIRMS).map(n=>`<option>${n}</option>`).join("");
  $("aFirm").innerHTML=firmOpts; $("aFirm2").innerHTML=firmOpts;
  $("aCity").innerHTML=`<option value="">Any city</option>`+Object.entries(CITYLABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("aSector").innerHTML=SECTORS.map(s=>`<option value="${s}">${s}</option>`).join("");
  $("aType").innerHTML=`<option value="">Any type</option>`+Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");
  $("aStage").innerHTML=`<option value="">Any stage</option>`+Object.entries(STAGES).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join("");
  $("advOpen").onclick=()=>{$("adv").classList.add("on");
    $("aFirm").value=F.firm;$("aFirm2").value=F.firm2;$("aCity").value=F.city;$("aSector").value=F.sector;$("aType").value=F.type||"";$("aStage").value=F.stage;$("aText").value=F.q;};
  $("adv").onclick=e=>{if(e.target.id==="adv")$("adv").classList.remove("on");};
  $("advReset").onclick=()=>{["aFirm","aFirm2","aCity","aType","aStage","aText"].forEach(i=>$(i).value="");$("aSector").value="All Sectors";};
  $("advApply").onclick=()=>{
    F.firm=$("aFirm").value;F.firm2=$("aFirm2").value;F.city=$("aCity").value;F.sector=$("aSector").value;
    F.type=$("aType").value||null;F.stage=$("aStage").value;F.q=$("aText").value;F.geo="all";$("q").value=F.q;
    $("adv").classList.remove("on");go({name:"feed"});
  };
}

/* ============================ MAIN RENDER ============================ */
function render(){
  markSidebar();
  if(route.name==="feed"){
    const list=DEALS.filter(matchesFilters);
    let title="All India",bits=[];
    if(F.firm)bits.push(F.firm); if(F.firm2)bits.push("+ "+F.firm2);
    if(F.city)bits.push(CITYLABEL[F.city]); else if(F.geo!=="all")bits.push(CITYLABEL[F.geo]);
    if(F.type)bits.push(TYPES[F.type].label); if(F.stage)bits.push(STAGES[F.stage].l);
    if(F.sector!=="All Sectors")bits.push(F.sector);
    if(bits.length)title=bits.join(" · ");
    renderFeed(title,list);
  }
  else if(route.name==="firms")renderFirms();
  else if(route.name==="firm")renderFirm(route.id);
  else if(route.name==="deal")renderDeal(route.id);
  else if(route.name==="watch")renderFeed("★ Watchlist",DEALS.filter(d=>starred.has(d.id)),starred.size+" starred");
}

/* ============================ INIT ============================ */
$("q").addEventListener("input",e=>{F.q=e.target.value;if(route.name!=="feed")route={name:"feed"};render();});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.id!=="q"&&!$("adv").classList.contains("on")){e.preventDefault();$("q").focus();}
  if(e.key==="Escape")$("adv").classList.remove("on");});
$("refresh").onclick=()=>{const u=$("updated");u.textContent="Refreshing…";setTimeout(()=>u.textContent="Updated just now",700);};
$("theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";};

buildSidebar();buildRail();buildAdv();render();
</script>
</body>
